<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus Flow</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>Focus Flow</h1>
      <p class="subtitle">Pomodoro timer that remembers which tasks you actually finish.</p>
    </header>

    <section class="timer-card">
      <div class="mode-tabs">
        <button class="mode-tab active" data-mode="focus">Focus</button>
        <button class="mode-tab" data-mode="short">Short Break</button>
        <button class="mode-tab" data-mode="long">Long Break</button>
      </div>

      <div class="timer-display" id="timerDisplay">25:00</div>

      <div class="active-task" id="activeTaskLabel">No task selected</div>

      <div class="timer-controls">
        <button id="startPauseBtn" class="primary-btn">Start</button>
        <button id="resetBtn" class="secondary-btn">Reset</button>
      </div>

      <div class="session-count" id="sessionCount">0 focus sessions completed today</div>
    </section>

    <section class="tasks-card">
      <h2>Tasks</h2>
      <form id="taskForm" class="task-form">
        <input type="text" id="taskInput" placeholder="What are you working on?" autocomplete="off" required>
        <button type="submit" class="primary-btn small">Add</button>
      </form>
      <ul id="taskList" class="task-list"></ul>
    </section>

    <section class="settings-card">
      <h2>Timer Lengths (minutes)</h2>
      <div class="settings-row">
        <label>Focus <input type="number" id="focusLength" min="1" max="120" value="25"></label>
        <label>Short Break <input type="number" id="shortLength" min="1" max="60" value="5"></label>
        <label>Long Break <input type="number" id="longLength" min="1" max="90" value="15"></label>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
